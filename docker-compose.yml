db:
  image: mysql:8.4
  container_name: campus_agenda_db
  restart: unless-stopped
  ports:
    # host:container. Só o localhost do seu computador enxerga o banco.
    - '127.0.0.1:${DB_PORT}:3306'
  environment:
    # A imagem lê estas variáveis na PRIMEIRA subida e cria o banco e o usuário.
    MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    MYSQL_DATABASE: ${DB_NAME}
    MYSQL_USER: ${DB_USER}
    MYSQL_PASSWORD: ${DB_PASSWORD}
    TZ: America/Belem
  volumes:
    # Volume nomeado: os dados sobrevivem a `docker compose down` (só `down -v` apaga).
    - db_data:/var/lib/mysql
  healthcheck:
    # `docker compose up --wait` só retorna quando o MySQL aceitar conexões.
    test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 20s
volumes:
  db_data:
